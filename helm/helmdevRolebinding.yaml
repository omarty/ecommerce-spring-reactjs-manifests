apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-dev-read-only
  namespace: ecommercehelm
subjects:
  - kind: User
    name: helmdev          # doit correspondre au CN du certificat
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-read-only
  apiGroup: rbac.authorization.k8s.io
