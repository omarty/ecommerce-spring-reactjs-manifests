namespace: ecommercehelm
hostname: ecommerce.server:30080 # SANS http://  (Spring ajoute http://)
postgres:
  image: postgres:15-alpine
  db: perfume
  user: postgres
  password: postgres
  storage: 1Gi
backend:
  image: omartankary/ecommerce-backend
  tag: sha-11dfdda
  replicaCount: 1
  port: 8080
  nodePort: 30808
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
frontend:
  image: omartankary/ecommerce-frontend
  tag: sha-11dfdda
  replicaCount: 1
  port: 80
  nodePort: 30080
