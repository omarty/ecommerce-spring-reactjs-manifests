namespace: ecommercehelm

hostname: ecommerce.server:30080   # SANS http://  (Spring ajoute http://)

postgres:
  image: postgres:15-alpine
  db: perfume
  user: postgres
  password: postgres
  storage: 1Gi

backend:
  image: omartankary/ecommerce-backend
  tag: latest
  replicaCount: 1
  port: 8080
  nodePort: 30808

frontend:
  image: omartankary/ecommerce-frontend
  tag: latest
  replicaCount: 1
  port: 80
  nodePort: 30080
